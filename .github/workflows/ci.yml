name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-api:
    name: Test API (Universal LLM & Checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install API dependencies
        run: |
          cd api
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint with Ruff
        run: |
          cd api
          ruff check .

      - name: Run Pytest Suite
        env:
          LLM_PROVIDER: fake
          DATABASE_URL: sqlite:///:memory:
        run: |
          cd api
          pytest api/tests/test_checks api/tests/test_value_normalization.py api/tests/test_semantic_candidates.py api/tests/test_llm.py -v

  test-web:
    name: Build & Verify Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: |
          cd web
          npm install

      - name: Build Web App
        run: |
          cd web
          npm run build

