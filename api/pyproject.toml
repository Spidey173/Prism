[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3",
  "pgvector>=0.3,<1", "PyMuPDF>=1.24,<2", "fastembed>=0.4,<1", "pysbd>=0.3.4,<1",
  "structlog>=24.4,<26", "python-multipart>=0.0.12,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.7,<1", "mypy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
